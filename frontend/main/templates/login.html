{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>AcadNet - Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #FF6B2B;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        .fondo {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
            opacity: 0.15;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: relative;
            z-index: 999;
        }
        .logo-box {
            background: #FF6B2B;
            width: 120px;
            height: 120px;
            border-radius: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .logo-text { color: white; font-size: 24px; margin: 0; }
        .logo-acad { font-family: 'Changa One', sans-serif; }
        .logo-net { font-family: 'Pacifico', cursive; }
        h2 { color: #333; font-size: 24px; }
        .error { color: red; font-size: 14px; }
        .input-group {
            display: flex;
            align-items: center;
            background: #f5f5f5;
            border-radius: 10px;
            padding: 12px 16px;
            width: 100%;
            gap: 10px;
        }
        .input-group input {
            border: none;
            background: transparent;
            outline: none;
            width: 100%;
            font-size: 15px;
        }
        .icon { color: #FF6B2B; font-size: 18px; }
        .btn {
            background: #FF6B2B;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px;
            width: 100%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #e55a1f; }
    </style>
</head>
<body>

    <svg class="fondo" xmlns="http://www.w3.org/2000/svg">
        <!-- Libros -->
        <rect x="50" y="80" width="40" height="50" rx="3" fill="white"/>
        <rect x="55" y="75" width="40" height="50" rx="3" fill="white"/>
        <rect x="200" y="300" width="40" height="50" rx="3" fill="white"/>
        <rect x="205" y="295" width="40" height="50" rx="3" fill="white"/>
        <rect x="900" y="150" width="40" height="50" rx="3" fill="white"/>
        <rect x="905" y="145" width="40" height="50" rx="3" fill="white"/>
        <rect x="1200" y="400" width="40" height="50" rx="3" fill="white"/>
        <rect x="1205" y="395" width="40" height="50" rx="3" fill="white"/>
        <rect x="400" y="500" width="40" height="50" rx="3" fill="white"/>
        <rect x="405" y="495" width="40" height="50" rx="3" fill="white"/>
        <rect x="700" y="50" width="40" height="50" rx="3" fill="white"/>
        <rect x="705" y="45" width="40" height="50" rx="3" fill="white"/>
        <rect x="1050" y="550" width="40" height="50" rx="3" fill="white"/>
        <rect x="1055" y="545" width="40" height="50" rx="3" fill="white"/>

        <!-- Lapices -->
        <line x1="150" y1="200" x2="180" y2="260" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <polygon points="180,260 170,275 190,275" fill="white"/>

        <polygon points="1130,360 1120,375 1140,375" fill="white"/>
        <line x1="500" y1="400" x2="530" y2="460" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <polygon points="530,460 520,475 540,475" fill="white"/>
        <line x1="1300" y1="100" x2="1330" y2="160" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <polygon points="1330,160 1320,175 1340,175" fill="white"/>
        <line x1="50" y1="400" x2="80" y2="460" stroke="white" stroke-width="8" stroke-linecap="round"/>
        <polygon points="80,460 70,475 90,475" fill="white"/>

        <!-- Sombreritos -->
        <polygon points="350,100 320,120 350,140 380,120" fill="white"/>
        <rect x="335" y="135" width="30" height="5" rx="2" fill="white"/>
        <line x1="380" y1="120" x2="380" y2="140" stroke="white" stroke-width="3"/>
        <circle cx="380" cy="143" r="4" fill="white"/>

        <polygon points="1000,300 970,320 1000,340 1030,320" fill="white"/>
        <rect x="985" y="335" width="30" height="5" rx="2" fill="white"/>

        <circle cx="1030" cy="343" r="4" fill="white"/>

        <polygon points="700,500 670,520 700,540 730,520" fill="white"/>
        <rect x="685" y="535" width="30" height="5" rx="2" fill="white"/>

        <circle cx="730" cy="543" r="4" fill="white"/>

        <polygon points="150,600 120,620 150,640 180,620" fill="white"/>
        <rect x="135" y="635" width="30" height="5" rx="2" fill="white"/>

        <polygon points="1300,500 1270,520 1300,540 1330,520" fill="white"/>
        <rect x="1285" y="535" width="30" height="5" rx="2" fill="white"/>

        <polygon points="600,200 570,220 600,240 630,220" fill="white"/>
        <rect x="585" y="235" width="30" height="5" rx="2" fill="white"/>

        <!-- Circulos decorativos -->
        <circle cx="500" cy="150" r="8" fill="white"/>
        <circle cx="600" cy="400" r="6" fill="white"/>
        <circle cx="100" cy="500" r="10" fill="white"/>
        <circle cx="1300" cy="200" r="8" fill="white"/>
        <circle cx="1400" cy="500" r="6" fill="white"/>
        <circle cx="250" cy="150" r="5" fill="white"/>

        <!-- Reglas -->
        <rect x="1200" y="100" width="8" height="80" rx="2" fill="white"/>

        <rect x="1210" y="125" width="15" height="3" fill="white"/>

        <rect x="1210" y="155" width="15" height="3" fill="white"/>

        <rect x="300" y="500" width="8" height="80" rx="2" fill="white"/>
        <rect x="310" y="510" width="15" height="3" fill="white"/>
        <rect x="310" y="525" width="15" height="3" fill="white"/>
        <rect x="310" y="540" width="15" height="3" fill="white"/>

        <rect x="650" y="300" width="8" height="80" rx="2" fill="white"/>
        <rect x="660" y="310" width="15" height="3" fill="white"/>
        <rect x="660" y="325" width="15" height="3" fill="white"/>
        <rect x="660" y="340" width="15" height="3" fill="white"/>

        <rect x="1000" y="50" width="8" height="80" rx="2" fill="white"/>
        <rect x="1010" y="60" width="15" height="3" fill="white"/>
        <rect x="1010" y="75" width="15" height="3" fill="white"/>
        <rect x="1010" y="90" width="15" height="3" fill="white"/>
    </svg>

    <div class="card">
        <div class="logo-box">
            <svg width="40" height="30" viewBox="0 0 80 60" xmlns="http://www.w3.org/2000/svg">
                <polygon points="40,5 10,25 40,45 70,25" fill="#ffffff"/>
                <rect x="25" y="40" width="30" height="5" rx="2" fill="#ffffff"/>
                <line x1="70" y1="25" x2="70" y2="45" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
                <circle cx="70" cy="47" r="4" fill="#ffffff"/>
            </svg>
            <span class="logo-text">
                <span class="logo-acad">Acad</span><span class="logo-net">Net</span>
            </span>
        </div>

        <h2>Iniciar Sesión</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" style="width:100%; display:flex; flex-direction:column; gap:15px;">
            {% csrf_token %}
            <div class="input-group">
                <span class="icon">👤</span>
                <input type="text" name="usuario" placeholder="Usuario">
            </div>
            <div class="input-group">
                <span class="icon">🔒</span>
                <input type="password" name="contrasenia" placeholder="Contraseña">
            </div>
            <button type="submit" class="btn">Iniciar Sesión</button>
        </form>
    </div>
</body>
</html>
