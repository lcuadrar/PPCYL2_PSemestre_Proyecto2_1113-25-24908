{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>AcadNet - Ver Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ffffff; font-family: Arial, sans-serif; min-height: 100vh; }
        .navbar {
            background: #FF6B2B;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-text { color: white; font-size: 24px; }
        .logo-acad { font-family: 'Changa One', sans-serif; }
        .logo-net { font-family: 'Pacifico', cursive; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 15px; }
        .container {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h2 {
            color: #FF6B2B;
            font-family: 'Changa One', sans-serif;
            font-size: 48px;
            margin-bottom: 30px;
        }
        table {
            border-collapse: collapse;
            width: 700px;
        }
        th {
            background: #FF6B2B;
            color: white;
            padding: 20px;
            font-size: 20px;
        }
        td {
            padding: 18px;
            border-bottom: 1px solid #eee;
            font-size: 18px;
            color: #333;
        }
        tr:hover td { background: #fff5f0; }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="logo-text">
            <span class="logo-acad">Acad</span><span class="logo-net">Net</span>
        </span>
        <div class="nav-links">
            <a href="/admin_panel/">Volver</a>
            <a href="/cerrar_sesion/">Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <h2>Revisión de Usuarios</h2>
        <table>
            <tr>
                <th>ID</th>
                <th>Usuario</th>
                <th>Rol</th>
            </tr>
            {% for u in usuarios %}
            <tr>
                <td>{{ forloop.counter }}</td>
                <td>{{ u.usuario }}</td>
                <td>{{ u.rol }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
