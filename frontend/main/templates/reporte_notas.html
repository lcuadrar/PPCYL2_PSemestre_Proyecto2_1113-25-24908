{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>AcadNet - Reportes</title>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One&family=Pacifico&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #ffffff; font-family: Arial, sans-serif; min-height: 100vh; }
        .navbar {
            background: #FF6B2B;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .logo-text { color: white; font-size: 24px; }
        .logo-acad { font-family: 'Changa One', sans-serif; }
        .logo-net { font-family: 'Pacifico', cursive; }
        .nav-links a { color: white; text-decoration: none; margin-left: 20px; font-size: 15px; }
        .container {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }
        h2 {
            color: #FF6B2B;
            font-family: 'Changa One', sans-serif;
            font-size: 48px;
            margin-bottom: 30px;
        }
        .selector {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            align-items: center;
        }
        select {
            padding: 12px 20px;
            border: 2px solid #FF6B2B;
            border-radius: 10px;
            font-size: 18px;
            color: #FF6B2B;
            outline: none;
            width: 300px;
            cursor: pointer;
        }
        }
        .btn {
            background: #FF6B2B;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 30px;
            font-size: 18px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn:hover { background: #e55a1f; }
        canvas {
            max-width: 700px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="navbar">
        <span class="logo-text">
            <span class="logo-acad">Acad</span><span class="logo-net">Net</span>
        </span>
        <div class="nav-links">
            <a href="/tutor_panel/">Volver</a>
            <a href="/cerrar_sesion/">Cerrar Sesión</a>
        </div>
    </div>

    <div class="container">
        <h2>Reporte Promedio de Notas</h2>

       <form method="POST" class="selector">
    {% csrf_token %}
    <select name="codigo_curso">
        <option value="">Seleccionar curso</option>
        {% for c in cursos %}
        <option value="{{ c.codigo }}" {% if curso_seleccionado == c.codigo %}selected{% endif %}>
            {{ c.codigo }} - {{ c.nombre }}
        </option>
        {% endfor %}
    </select>
    <button type="submit" class="btn">Seleccionar</button>
    </form>

        {% if promedios %}
        <canvas id="grafica" width="700" height="400"></canvas>
        <script>
            const labels = [{% for p in promedios %}"{{ p.actividad }}",{% endfor %}];
            const datos = [{% for p in promedios %}{{ p.promedio }},{% endfor %}];

            new Chart(document.getElementById('grafica'), {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Promedio de notas',
                        data: datos,
                        backgroundColor: '#FF6B2B',
                        borderColor: '#e55a1f',
                        borderWidth: 1
                    }]
                },
                options: {
                    scales: {
                        y: { beginAtZero: true, max: 100 }
                    }
                }
            });
        </script>
        {% endif %}
    </div>
</body>
</html>
